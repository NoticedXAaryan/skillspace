name: 'Validate SkillSpace Package'
description: 'Validates a skill.yaml or agent.yaml manifest using the SkillSpace CLI'
inputs:
  manifest_path:
    description: 'Path to the skill.yaml or agent.yaml file'
    required: false
    default: '.'
runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Validate Manifest
      shell: bash
      run: |
        npx --yes @skillspace/cli validate ${{ inputs.manifest_path }}
